# general settings
name: train_AIO_DPMambaIR
model_type: ImageCleanMultiLossModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: AIOPairedImageDataset
    geometric_augs: true
    dir: train
    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 16
    batch_size_per_gpu: 16

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,5,4,2,1,1]             # Batch size per gpu   
    # iters: [92000,64000,48000,36000,36000,24000]
    # gt_size: 384   # Max patch size for progressive training
    # gt_sizes: [128,160,192,256,320,384]  # Patch sizes for progressive training.

    mini_batch_sizes: [16,10,8,4,3,2]             # Batch size per gpu   
    # iters: [92000,64000,48000,36000,36000,24000]
    iters: [10000,10000,10000,10000,5000,5000]
    gt_size: 384   # Max patch size for progressive training
    gt_sizes: [128,160,192,256,320,384]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    # mini_batch_sizes: [1]   
    # iters: [560000]
    # gt_size: 256   
    # gt_sizes: [256]
    # ## ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: MiniTest
    type: AIOPairedImageDataset
    dir: minitest
    io_backend:
      type: disk
    # name: jpeg
    # type: TestPairedImageDataset
    # geometric_augs: true
    # dataroot: /zs/Data/AllInOneDataset/jpeg/test
    # filename_tmpl: '{}'
    # io_backend:
    #   type: disk

    # name: Test
    # type: AIOPairedImageDataset
    # dir: test
    # io_backend:
    #   type: disk

# network structures
network_g:
  type: DPMambaIR
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 2
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False


# path
path:
  pretrain_network_g: /zs/Restormer/experiments/train_AIO_DPMambaIR_Finetune/models/net_g_78000.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 50000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    # type: MultiStepLR
    # milestones: [30000, 150000, 250000, 400000, 450000, 500000]
    # gamma: 0.5
    # type: CosineAnnealingRestartCyclicLR
    # periods: [92000, 208000]       
    # restart_weights: [1,1]
    # eta_mins: [0.0003,0.000001]  
    type: CosineAnnealingRestartCyclicLR
    periods: [10000, 40000]       
    restart_weights: [1,1]
    eta_mins: [0.000008, 0.0000001]
  
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 8e-6
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    # ssim: # metric name, can be arbitrary
    #   type: calculate_ssim
    #   crop_border: 0
    #   test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
