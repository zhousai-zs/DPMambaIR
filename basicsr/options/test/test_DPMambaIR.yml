  #   dataroot: /zs/Data/AllInOneDataset/rain/test
  #   filename_tmpl: '{}'
  #   io_backend:
  #     type: disk
  fog:
    name: fog
    type: TestPairedImageDataset
    geometric_augs: true
    dataroot: /zs/Data/AllInOneDataset/fog/test
    filename_tmpl: '{}'
    io_backend:
      type: disk
  snow:
    name: snow
    type: TestPairedImageDataset
    geometric_augs: true
    dataroot: /zs/Data/AllInOneDataset/snow/test
    filename_tmpl: '{}'
    io_backend:
      type: disk
  # jpeg:
  #   name: jpeg
