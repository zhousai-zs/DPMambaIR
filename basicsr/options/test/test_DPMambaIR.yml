  noise:
    name: noise
    type: TestPairedImageDataset
    geometric_augs: true
    dataroot: /zs/Data/AllInOneDataset/noise/test
    filename_tmpl: '{}'
    io_backend:
      type: disk
  blur:
    name: blur
    type: TestPairedImageDataset
    geometric_augs: true
    dataroot: /zs/Data/AllInOneDataset/blur/test
