# general settings
name: test_DPMambaIR_jpeg
model_type: ImageCleanMultiLossModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  # val:
    # name: MiniTest
    # type: AIOPairedImageDataset
    # dir: minitest
    # io_backend:
    #   type: disk
  # lowlight:
  #   name: lowlight
  #   type: TestPairedImageDataset
  #   geometric_augs: true
